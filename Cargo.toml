[package]
name = "trusty-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line client for Trustify"
license = "Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/trusty-cli"
keywords = ["trustify", "sbom", "security"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "trusty_cli"
path = "src/lib.rs"

[[bin]]
name = "trusty"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5"

[dev-dependencies]
wiremock = "0.6"
