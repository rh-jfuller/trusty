[package]
name = "trusty-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Command-line client for Trustify"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/rh-jfuller/trusty"
documentation = "https://docs.rs/trusty-cli"
keywords = ["trustify", "sbom", "security"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "trusty_cli"
path = "src/lib.rs"

[[bin]]
name = "trusty"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = { version = "0.30.1", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.4.1", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
trustify-client = "0.1.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[dev-dependencies]
wiremock = "0.6"
